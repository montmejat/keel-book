# Publishes book/ to GitHub Pages, at montmejat.github.io/keel-book: static
# pages, no build step. Needs the repository's Pages source set to "GitHub
# Actions" (Settings → Pages).
name: Pages

on:
  push:
    branches: [main]
    paths: ["book/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: book
      - id: deployment
        uses: actions/deploy-pages@v4
